name: Windows executor lifecycle

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/executor/step_runners/code_call.rs"
      - ".github/workflows/windows-executor.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/executor/step_runners/code_call.rs"
      - ".github/workflows/windows-executor.yml"

permissions:
  contents: read

jobs:
  job-object-containment:
    name: Job Object containment
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-executor

      - name: Test descendant containment
        run: >-
          cargo test --locked --lib
          executor::step_runners::code_call::output_mapping_tests::windows_job_contains_child_and_kills_descendants_when_closed
          -- --exact
